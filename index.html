<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinpoint</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cursor" viewBox="0 0 16 16"><path d="M3.2 2.6l9.6 4.1-4.1 1.3-1.4 4.2-4.1-9.6Z"/></symbol>
  <symbol id="i-desktop" viewBox="0 0 16 16"><rect x="1.75" y="2.75" width="12.5" height="8.5" rx="1.5"/><path d="M5.5 14h5M8 11.25V14"/></symbol>
  <symbol id="i-tablet" viewBox="0 0 16 16"><rect x="3" y="1.75" width="10" height="12.5" rx="1.75"/><path d="M7 12h2"/></symbol>
  <symbol id="i-mobile" viewBox="0 0 16 16"><rect x="4.5" y="1.75" width="7" height="12.5" rx="1.75"/><path d="M7.25 12h1.5"/></symbol>
  <symbol id="i-globe" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c1.7 1.7 2.5 3.7 2.5 6S9.7 12.3 8 14C6.3 12.3 5.5 10.3 5.5 8S6.3 3.7 8 2Z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></symbol>
  <symbol id="i-code" viewBox="0 0 16 16"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5"/></symbol>
  <symbol id="i-panel" viewBox="0 0 16 16"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M10 2.75v10.5"/></symbol>
  <symbol id="i-spark" viewBox="0 0 16 16"><path d="M8 1.8l1.3 3.3 3.3 1.3-3.3 1.3L8 11 6.7 7.7 3.4 6.4l3.3-1.3L8 1.8ZM12.5 10.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6.6-1.4Z"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></symbol>
  <symbol id="i-trash" viewBox="0 0 16 16"><path d="M2.75 4.5h10.5M6.25 4.5V3h3.5v1.5M4.25 4.5l.6 8.75h6.3l.6-8.75"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></symbol>
  <symbol id="i-undo" viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.5-3.6M3 2.75V5.5h2.75"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 16 16"><path d="M10.25 2.75l3 3L6 13H3v-3l7.25-7.25Z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4"/></symbol>
  <symbol id="i-pin" viewBox="0 0 16 16"><path d="M8 14.25s-4.75-4.2-4.75-7.75a4.75 4.75 0 0 1 9.5 0C12.75 10.05 8 14.25 8 14.25Z"/><circle cx="8" cy="6.5" r="1.6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.25" y="5.25" width="8.5" height="8.5" rx="1.5"/><path d="M10.75 5.25V3.75a1.5 1.5 0 0 0-1.5-1.5h-5.5a1.5 1.5 0 0 0-1.5 1.5v5.5a1.5 1.5 0 0 0 1.5 1.5h1.5"/></symbol>
  <symbol id="i-download" viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></symbol>
  <symbol id="i-warn" viewBox="0 0 16 16"><path d="M8 2.25 14.25 13H1.75L8 2.25Z"/><path d="M8 6.5v3M8 11.25v.01"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.7-3.97M13.25 2.5V5.5h-3"/></symbol>
  <symbol id="i-external" viewBox="0 0 16 16"><path d="M9 2.75h4.25V7M13.25 2.75 7.5 8.5M12.25 9.75v2.5a1.5 1.5 0 0 1-1.5 1.5h-7a1.5 1.5 0 0 1-1.5-1.5v-7a1.5 1.5 0 0 1 1.5-1.5h2.5"/></symbol>
  <symbol id="i-file" viewBox="0 0 16 16"><path d="M9 1.75H4.5A1.5 1.5 0 0 0 3 3.25v9.5a1.5 1.5 0 0 0 1.5 1.5h7a1.5 1.5 0 0 0 1.5-1.5V5.75L9 1.75Z"/><path d="M8.75 2v4h4.1"/></symbol>
</svg>

<div class="app">

  <!-- ─────────── Toolbar ─────────── -->
  <header class="topbar">
    <div class="tb-left">
      <div class="brand">
        <span class="logo"><svg class="i"><use href="#i-pin"/></svg></span>
        <span class="brand-name">Pinpoint</span>
      </div>
      <span class="vsep"></span>
      <div class="file" id="fileChip">
        <svg class="i"><use href="#i-file"/></svg>
        <b>webpage.html</b>
        <span class="file-title" id="fileTitle"></span>
      </div>
      <button class="ib" id="btnReload" type="button" data-tip="Reload page  R" aria-label="Reload page"><svg class="i"><use href="#i-refresh"/></svg></button>
    </div>

    <div class="tools" role="toolbar" aria-label="Tools">
      <button class="tool" id="inspectToggle" aria-pressed="true" data-tip="Inspect  I" aria-label="Inspect"><svg class="i"><use href="#i-cursor"/></svg></button>
      <span class="vsep"></span>
      <div class="vp" id="viewportSeg" role="group" aria-label="Viewport">
        <button class="tool" data-vp="desktop" aria-pressed="true" data-tip="Desktop" aria-label="Desktop"><svg class="i"><use href="#i-desktop"/></svg></button>
        <button class="tool" data-vp="tablet" aria-pressed="false" data-tip="Tablet · 1024" aria-label="Tablet"><svg class="i"><use href="#i-tablet"/></svg></button>
        <button class="tool" data-vp="mobile" aria-pressed="false" data-tip="Mobile · 390" aria-label="Mobile"><svg class="i"><use href="#i-mobile"/></svg></button>
      </div>
    </div>

    <div class="tb-right">
      <a class="ib" id="btnRaw" href="annotations.html" target="_blank" rel="noopener" data-tip="Raw annotations" aria-label="Open raw annotations">
        <svg class="i"><use href="#i-external"/></svg>
      </a>
      <button class="ib" id="sidebarToggle" type="button" aria-pressed="true" aria-expanded="true" data-tip="Comments" aria-label="Toggle comments">
        <svg class="i"><use href="#i-panel"/></svg>
      </button>
      <button class="btn primary" id="btnExport" type="button">
        <svg class="i"><use href="#i-spark"/></svg>Export<span class="count" id="countBadge">0</span>
      </button>
    </div>
  </header>

  <main class="workspace">
    <!-- ─────────── Canvas ─────────── -->
    <section class="stage" id="stage">
      <div class="stage-scroll" id="stageScroll">
        <div class="frame-wrap" id="frameWrap" data-vp="desktop">
          <div class="frame-label"><b id="frameLabel">Desktop</b><span class="spacer"></span><span id="dims">—</span></div>
          <div class="frame-box">
            <iframe id="frame" title="webpage.html preview" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>
          </div>
        </div>
      </div>

      <div class="empty-stage" id="emptyStage" hidden>
        <div class="es-card">
          <span class="es-icon err"><svg class="i"><use href="#i-warn"/></svg></span>
          <h3 id="esTitle">Can't load webpage.html</h3>
          <p id="esText"></p>
          <button class="btn" id="esRetry" type="button"><svg class="i"><use href="#i-refresh"/></svg>Try again</button>
        </div>
      </div>

      <!-- Annotation popover -->
      <div class="popover" id="popover" role="dialog" aria-label="Comment" hidden>
        <div class="pop-head">
          <span class="pin-num" id="popNum">1</span>
          <div class="pop-title">
            <div class="pop-el"><span id="popEl"></span><span class="pop-size" id="popSize"></span></div>
            <div class="pop-sel" id="popSel"></div>
          </div>
          <button class="ib sm" id="popClose" type="button" aria-label="Close (Esc)"><svg class="i"><use href="#i-x"/></svg></button>
        </div>

        <div class="pop-body">
          <textarea id="popComment" rows="3" placeholder="What should change?"></textarea>
          <div class="chips" id="tagChips" role="group" aria-label="Tag"></div>

          <div class="field" id="textField" hidden>
            <label for="popText">Text</label>
            <input type="text" id="popText">
          </div>

          <details class="tweaks" id="tweaks">
            <summary><svg class="i chev"><use href="#i-chev"/></svg>Style tweaks<span class="tc" id="tweakCount"></span></summary>
            <div class="tw-body">
              <div class="crow" data-k="bg"><label>Fill</label><input type="color" aria-label="Background color"><code class="cval"></code><button class="ib xs mini" data-reset="bg" type="button" aria-label="Reset" hidden><svg class="i"><use href="#i-undo"/></svg></button></div>
              <div class="crow" data-k="color"><label>Text</label><input type="color" aria-label="Text color"><code class="cval"></code><button class="ib xs mini" data-reset="color" type="button" aria-label="Reset" hidden><svg class="i"><use href="#i-undo"/></svg></button></div>
              <div class="crow" data-k="border"><label>Border</label><input type="color" aria-label="Border color"><code class="cval"></code><button class="ib xs mini" data-reset="border" type="button" aria-label="Reset" hidden><svg class="i"><use href="#i-undo"/></svg></button></div>
              <div class="nudge">
                <label>Move</label>
                <div class="pad" aria-label="Nudge position">
                  <span></span><button data-dx="0" data-dy="-1" type="button" aria-label="Up">↑</button><span></span>
                  <button data-dx="-1" data-dy="0" type="button" aria-label="Left">←</button><button class="mid" data-reset-nudge type="button" aria-label="Reset position">·</button><button data-dx="1" data-dy="0" type="button" aria-label="Right">→</button>
                  <span></span><button data-dx="0" data-dy="1" type="button" aria-label="Down">↓</button><span></span>
                </div>
                <div class="nudge-opts">
                  <code class="read" id="nudgeRead">0, 0</code>
                  <div class="seg" id="stepSeg" role="group" aria-label="Step"><button data-step="1">1</button><button data-step="5">5</button><button data-step="10">10</button></div>
                  <div class="seg" id="modeSeg" role="group" aria-label="Method"><button data-mode="transform">translate</button><button data-mode="margin">margin</button></div>
                </div>
              </div>
            </div>
          </details>
        </div>

        <div class="pop-foot">
          <button class="ib sm danger" id="popDelete" type="button" aria-label="Delete" data-tip="Delete"><svg class="i"><use href="#i-trash"/></svg></button>
          <span class="spacer"></span>
          <button class="btn ghost sm" id="popCancel" type="button">Cancel</button>
          <button class="btn primary sm" id="popSave" type="button"><span id="popSaveLabel">Save</span><kbd class="k-in" data-mod>↵</kbd></button>
        </div>
      </div>
    </section>

    <!-- ─────────── Sidebar ─────────── -->
    <aside class="sidebar" id="sidebar" aria-label="Comments">
      <div class="sb-inner">
        <div class="sb-head">
          <span class="sb-title">Comments</span><span class="count" id="sbCount">0</span>
          <span class="spacer"></span>
          <button class="ib sm" id="btnClear" type="button" data-tip="Clear all" aria-label="Clear all"><svg class="i"><use href="#i-trash"/></svg></button>
        </div>
        <div class="sb-tabs">
          <div class="seg full" id="filterSeg" role="group" aria-label="Filter">
            <button data-f="all" aria-pressed="true">All</button><button data-f="open" aria-pressed="false">Open</button><button data-f="resolved" aria-pressed="false">Resolved</button>
          </div>
        </div>
        <div class="list" id="list"></div>
      </div>
    </aside>
  </main>

  <!-- ─────────── Status bar ─────────── -->
  <footer class="statusbar">
    <span class="st"><i class="dot" id="stDot"></i><span id="stSource">webpage.html</span></span>
    <span class="st" id="stMode">Inspect</span>
    <span class="spacer"></span>
    <span class="st keys"><kbd>I</kbd> inspect <kbd>R</kbd> reload <kbd>Esc</kbd> cancel <kbd><span data-mod-key>Ctrl</span>↵</kbd> save <kbd>←↑→↓</kbd> nudge</span>
  </footer>
</div>

<!-- ─────────── Export ─────────── -->
<div class="modal" id="exportModal" role="dialog" aria-modal="true" aria-labelledby="exTitle">
  <div class="dialog">
    <div class="dlg-head">
      <h2 id="exTitle">Export prompt</h2>
      <span class="spacer"></span>
      <button class="ib sm" data-close type="button" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="dlg-body">
      <div class="opts">
        <div>
          <div class="opt-label">Format</div>
          <div class="fmt" role="radiogroup">
            <label><input type="radio" name="target" value="cursor" checked><span>Agent</span></label>
            <label><input type="radio" name="target" value="chat"><span>Chat</span></label>
            <label><input type="radio" name="target" value="report"><span>Report</span></label>
          </div>
          <p class="fmt-desc" id="fmtDesc"></p>
        </div>
        <div>
          <div class="opt-label">Include</div>
          <label class="sw-row">HTML snippet<input type="checkbox" class="switch" id="oHtml" checked></label>
          <label class="sw-row">Computed styles<input type="checkbox" class="switch" id="oCss" checked></label>
          <label class="sw-row">Style tweaks<input type="checkbox" class="switch" id="oMods" checked></label>
          <label class="sw-row">Resolved comments<input type="checkbox" class="switch" id="oResolved"></label>
          <label class="sw-row">Wrap in code fence<input type="checkbox" class="switch" id="oWrap" checked></label>
        </div>
        <div>
          <div class="opt-label">Project context</div>
          <textarea id="oNotes" rows="3" placeholder="e.g. React + Tailwind, components in src/components"></textarea>
        </div>
      </div>
      <div class="out">
        <textarea id="output" spellcheck="false" aria-label="Generated prompt" placeholder="No comments yet. Click an element in the preview to add one."></textarea>
      </div>
    </div>
    <div class="dlg-foot">
      <span class="stats" id="outStats">—</span>
      <span class="spacer"></span>
      <button class="btn ghost" id="btnDownload" type="button"><svg class="i"><use href="#i-download"/></svg>.md</button>
      <a class="btn ghost" href="annotations.html" target="_blank" rel="noopener"><svg class="i"><use href="#i-external"/></svg>Raw view</a>
      <button class="btn primary" id="btnCopy" type="button"><svg class="i"><use href="#i-copy"/></svg><span>Copy prompt</span></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="prompt.js"></script>
<script src="script.js"></script>
</body>
</html>
